# =====================================================================
# Warehouse Management System (WMS) - Production Apache Configuration
# =====================================================================

<VirtualHost *:80>
    ServerName wms.lintasarta.co.id
    ServerAlias www.wms.lintasarta.co.id
    ServerAdmin webmaster@lintasarta.co.id

    # Document Root (Update path as per deployment server directory)
    DocumentRoot "/var/www/html/WarehouseManagementSystem"

    <Directory "/var/www/html/WarehouseManagementSystem">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Directory Index Order
        DirectoryIndex index.php index.html
    </Directory>

    # Protect Sensitive Files & Directories
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/\.(git|svn)|/(config|database|scratch)">
        Require all denied
    </DirectoryMatch>

    # Production Security Headers (requires mod_headers)
    <IfModule mod_headers.c>
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-Content-Type-Options "nosniff"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Enable Gzip Compression (requires mod_deflate)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Logging Configuration
    ErrorLog ${APACHE_LOG_DIR}/wms_error.log
    CustomLog ${APACHE_LOG_DIR}/wms_access.log combined
</VirtualHost>

