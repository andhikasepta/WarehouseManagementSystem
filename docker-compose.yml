# =====================================================================
# Warehouse Management System (WMS) - Docker Compose
# =====================================================================
# Services: PHP/Apache app + MySQL 8.0
# Usage:
#   docker-compose up -d --build      (start)
#   docker-compose down               (stop)
#   docker-compose logs -f app        (view app logs)
# =====================================================================


services:
  # ── WMS Application (PHP + Apache) ────────────────────────────────
  app:
    image: andhikasepta/warehousemanagementsystem:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_NAME=${APP_NAME:-Warehouse Management System}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Jakarta}
      - DB_DRIVER=${DB_DRIVER:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secure_password}
      - DB_NAME=${DB_NAME:-dashboard_db}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-7200}
      - SESSION_SECURE=${SESSION_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wms-network
    volumes:
      - app-uploads:/var/www/html/img/uploads

  # ── MySQL Database ────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: wms-db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE: ${DB_NAME:-dashboard_db}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wms-network

  # ── phpMyAdmin (Optional - Dev/Debug) ─────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5
    container_name: wms-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wms-network
    profiles:
      - dev

# ── Volumes ─────────────────────────────────────────────────────────
volumes:
  db-data:
    driver: local
  app-uploads:
    driver: local

# ── Networks ────────────────────────────────────────────────────────
networks:
  wms-network:
    driver: bridge
