# =====================================================================
# Warehouse Management System (WMS) - Docker Compose Configuration
# Target VM Host: 103.123.100.12
# Database Host : 103.123.100.14 (PostgreSQL)
# =====================================================================
# Quick Commands:
#   docker compose up -d --build             # Build & Start in background
#   docker compose ps                        # Check service status
#   docker compose logs -f app               # Follow app real-time logs
#   docker compose down                      # Stop containers
# =====================================================================

services:
  # ── Main Application (PHP 8.2 + Apache) ───────────────────────────
  app:
    image: andhikasepta/warehousemanagementsystem:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    restart: always
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-Warehouse Management System - Lintasarta}
      APP_URL: ${APP_URL:-https://wmsdev.my.id}
      APP_PORT: ${APP_PORT:-8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      DB_DRIVER: ${DB_DRIVER:-pgsql}
      DB_HOST: ${DB_HOST:-103.123.100.14}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-dashboard_db}
      DB_USER: ${DB_USER:-deutsch}
      DB_PASSWORD: ${DB_PASSWORD:-S3pt4@}
      SESSION_SAVE_HANDLER: ${SESSION_SAVE_HANDLER:-redis}
      SESSION_SAVE_PATH: ${SESSION_SAVE_PATH:-tcp://103.123.100.11:6379?timeout=2.5}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-900}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      REDIS_HOST: ${REDIS_HOST:-103.123.100.11}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2.5}
    volumes:
      - app-uploads:/var/www/html/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - wms-network

  # ── Optional: Local MySQL Service (Used if hosting DB locally) ────
  db:
    image: mysql:8.0
    container_name: wms-db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_secure_password}
      MYSQL_DATABASE: ${DB_NAME:-dashboard_db}
      MYSQL_USER: ${MYSQL_USER:-wms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysql_secure_password}
    volumes:
      - db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mysql_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wms-network
    profiles:
      - with-local-db

  # ── Optional: phpMyAdmin for Database Management ─────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wms-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_secure_password}
    networks:
      - wms-network
    profiles:
      - dev

# ── Persistent Storage Volumes ──────────────────────────────────────
volumes:
  app-uploads:
    driver: local
  db-data:
    driver: local

# ── Isolated Network ────────────────────────────────────────────────
networks:
  wms-network:
    driver: bridge
