# =====================================================================
# Warehouse Management System (WMS) - Docker Compose
# =====================================================================
# Services: PHP/Apache app + MySQL 8.0
# Usage:
#   docker-compose up -d --build      (start)
#   docker-compose down               (stop)
#   docker-compose logs -f app        (view app logs)
# =====================================================================


services:
  # ── WMS Application (PHP + Apache) ────────────────────────────────
  app:
    image: andhikasepta/warehousemanagementsystem:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_NAME=${APP_NAME:-Warehouse Management System}
      - APP_URL=${APP_URL:-https://wmsdev.my.id}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Jakarta}
      - DB_DRIVER=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password}
      - DB_NAME=${DB_NAME:-dashboard_db}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-7200}
      - SESSION_SECURE=${SESSION_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wms-network
    volumes:
      - app-uploads:/var/www/html/uploads

  # ── PostgreSQL Database ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: wms-db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${DB_NAME:-dashboard_db}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-dashboard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wms-network

  # ── pgAdmin (Optional - Dev/Debug) ────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wms-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@wms.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wms-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    profiles:
      - dev

# ── Volumes ─────────────────────────────────────────────────────────
volumes:
  db-data:
    driver: local
  app-uploads:
    driver: local
  pgadmin-data:
    driver: local

# ── Networks ────────────────────────────────────────────────────────
networks:
  wms-network:
    driver: bridge
