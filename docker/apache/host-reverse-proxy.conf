# =====================================================================
# Host Apache Reverse Proxy Configuration for Ubuntu VM (103.123.100.13)
# Place this file in: /etc/apache2/sites-available/wms.conf
# Enable with: sudo a2enmod proxy proxy_http headers rewrite ssl
#              sudo a2ensite wms.conf
#              sudo systemctl reload apache2
# =====================================================================

<VirtualHost *:80>
    ServerName wmsdev.my.id
    ServerAlias 5wmsdev.my.id 103.123.100.13

    # Enable proxy engine and preserve original host header
    ProxyPreserveHost On
    ProxyRequests Off

    # Forward client headers to container
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Forward all traffic to Docker container running on port 8080
    ProxyPass / http://127.0.0.1:8080/ retry=1 acquire=3000 timeout=600 Keepalive=On
    ProxyPassReverse / http://127.0.0.1:8080/

    # Real Client IP passing
    <IfModule mod_remoteip.c>
        RemoteIPHeader X-Forwarded-For
        RemoteIPInternalProxy 127.0.0.1
    </IfModule>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/wms_error.log
    CustomLog ${APACHE_LOG_DIR}/wms_access.log combined
</VirtualHost>
