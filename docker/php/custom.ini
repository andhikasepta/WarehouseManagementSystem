; =====================================================================
; Warehouse Management System (WMS) - Custom PHP Configuration
; =====================================================================

; Upload & POST limits
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Session settings (Redis session storage on Middleware VM 103.123.100.11)
session.save_handler = redis
session.save_path = "tcp://103.123.100.11:6379?timeout=2.5"
session.gc_maxlifetime = 900
session.cookie_httponly = 1
session.use_only_cookies = 1

; OPcache settings for production performance
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Timezone
date.timezone = Asia/Jakarta

; Error reporting for production
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
